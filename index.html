<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentaan</title>
  <link rel="icon" href="/icon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icon.svg" alt="" width="26" height="26" />
      <span class="brand-name" data-i18n="appName">Documentaan</span>
      <span class="file-name" id="fileName"></span>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnOpen" data-i18n="open">Open</button>
      <button class="btn primary" id="btnSave" data-i18n="save" disabled>Save</button>
      <button class="btn" id="btnPrint" data-i18n="print" disabled>Print</button>
      <div class="menu">
        <button class="btn" id="btnTools" data-i18n="tools">Tools ▾</button>
        <div class="menu-list" id="toolsMenu" hidden>
          <button data-act="merge" data-i18n="merge">Merge PDFs</button>
          <button data-act="split" data-i18n="split">Split / Extract pages</button>
          <button data-act="images" data-i18n="imagesToPdf">Images to PDF</button>
          <button data-act="insertBlank" data-i18n="insertBlank">Insert blank page</button>
          <button data-act="watermark" data-i18n="watermark">Watermark</button>
          <button data-act="pageNumbers" data-i18n="pageNumbers">Page numbers</button>
          <button data-act="protect" data-i18n="protect">Password protect</button>
          <button data-act="forms" data-i18n="fillForm">Fill form fields</button>
          <button data-act="flatten" data-i18n="flatten">Flatten form</button>
        </div>
      </div>
      <button class="btn icon" id="btnLang" title="Language">ने</button>
      <button class="btn icon" id="btnTheme" title="Theme">◐</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="group">
      <button class="tool active" data-tool="select" data-i18n-title="tSelect" title="Select">↖</button>
      <button class="tool" data-tool="text" data-i18n-title="tText" title="Text">T</button>
      <button class="tool" data-tool="highlight" data-i18n-title="tHighlight" title="Highlight"><span class="hl">ab</span></button>
      <button class="tool" data-tool="pen" data-i18n-title="tPen" title="Pen">✎</button>
      <button class="tool" data-tool="rect" data-i18n-title="tRect" title="Rectangle">▭</button>
      <button class="tool" data-tool="ellipse" data-i18n-title="tEllipse" title="Ellipse">◯</button>
      <button class="tool" data-tool="line" data-i18n-title="tLine" title="Line">╱</button>
      <button class="tool" data-tool="note" data-i18n-title="tNote" title="Sticky note">🗨</button>
      <button class="tool" data-tool="check" data-i18n-title="tCheck" title="Check mark">✓</button>
      <button class="tool" data-tool="cross" data-i18n-title="tCross" title="Cross">✗</button>
      <button class="tool" data-tool="date" data-i18n-title="tDate" title="Date">📅</button>
      <button class="tool" data-tool="whiteout" data-i18n-title="tWhiteout" title="White-out">▯</button>
    </div>
    <div class="group">
      <button class="btn sign" id="btnSign" data-i18n="sign">✍ Sign</button>
    </div>
    <div class="group">
      <input type="color" id="color" value="#d0021b" title="Color" />
      <select id="size" title="Size">
        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        <option value="5">5</option><option value="8">8</option>
      </select>
      <select id="fontSize" title="Font size">
        <option>10</option><option>12</option><option selected>14</option><option>18</option><option>24</option><option>32</option>
      </select>
    </div>
    <div class="group">
      <button class="tool" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tool" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <div class="group">
      <button class="tool" id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button class="tool" id="zoomIn">+</button>
      <button class="tool" id="zoomFit" data-i18n-title="fitWidth" title="Fit width">↔</button>
    </div>
    <div class="group">
      <input id="pageInput" type="number" min="1" value="1" /> <span id="pageCount">/ 0</span>
    </div>
    <div class="group search">
      <input id="searchInput" type="search" data-i18n-ph="search" placeholder="Search text" />
    </div>
  </div>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head"><span data-i18n="pages">Pages</span></div>
      <div id="thumbs"></div>
      <div id="searchResults" hidden></div>
    </aside>
    <section class="viewer" id="viewer">
      <div class="empty" id="empty">
        <div class="drop">
          <img src="/icon.svg" alt="" width="64" height="64" />
          <h1 data-i18n="welcome">Welcome to Documentaan</h1>
          <p data-i18n="dropHint">Drop a PDF here or click Open. Everything stays on your computer.</p>
          <div class="row">
            <button class="btn primary" id="btnOpen2" data-i18n="open">Open</button>
            <button class="btn" data-act="images" data-i18n="imagesToPdf">Images to PDF</button>
            <button class="btn" data-act="merge" data-i18n="merge">Merge PDFs</button>
          </div>
        </div>
      </div>
      <div id="pages"></div>
    </section>
  </main>

  <input type="file" id="fileInput" accept="application/pdf" hidden />
  <div id="modalRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
