<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentaan</title>
  <link rel="icon" href="/icon.svg" />
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="tb-left" data-tauri-drag-region>
      <div class="menu">
        <button class="tb-btn" id="btnMenu" aria-haspopup="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu">Menu</span></button>
        <div class="menu-list" id="mainMenu" hidden>
          <button id="btnOpen"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span data-i18n="open">Open</span><kbd>Ctrl+O</kbd></button>
          <button id="mSave" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span data-i18n="saveFull">Save</span><kbd>Ctrl+S</kbd></button>
          <button id="mSaveAs" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v6"/><path d="M5 4v16h7"/><path d="M16 16v6M13 19h6"/></svg><span data-i18n="saveAs">Save as</span><kbd>Ctrl+Shift+S</kbd></button>
          <button id="btnPrint" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 14h10v6H7z"/></svg><span data-i18n="print">Print</span><kbd>Ctrl+P</kbd></button>
          <hr>
          <button id="mClose" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="closeDoc">Close document</span></button>
        </div>
      </div>
      <button class="tb-btn icon" id="btnHome" data-i18n-title="home" title="Home"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
      <div class="menu">
        <button class="tb-btn" id="btnTools"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span data-i18n="toolsShort">Tools</span></button>
        <div class="menu-list" id="toolsMenu" hidden>
          <button data-act="merge"><span data-i18n="merge">Merge PDFs</span></button>
          <button data-act="split"><span data-i18n="split">Split / Extract pages</span></button>
          <button data-act="images"><span data-i18n="imagesToPdf">Images to PDF</span></button>
          <button data-act="insertBlank"><span data-i18n="insertBlank">Insert blank page</span></button>
          <hr>
          <button data-act="watermark"><span data-i18n="watermark">Watermark</span></button>
          <button data-act="pageNumbers"><span data-i18n="pageNumbers">Page numbers</span></button>
          <button data-act="protect"><span data-i18n="protect">Password protect</span></button>
          <hr>
          <button data-act="forms"><span data-i18n="fillForm">Fill form fields</span></button>
          <button data-act="flatten"><span data-i18n="flatten">Flatten form</span></button>
        </div>
      </div>
      <div class="doc-tab" id="docTab" hidden data-tauri-drag-region>
        <span class="doc-ico">PDF</span><span class="file-name" id="fileName" data-tauri-drag-region></span><span class="dirty-dot" title="Unsaved changes"></span>
      </div>
    </div>
    <div class="tb-center" data-tauri-drag-region><img src="/icon.svg" alt="" width="16" height="16" data-tauri-drag-region><span data-i18n="appName" data-tauri-drag-region>Documentaan</span></div>
    <div class="tb-right">
      <button class="tb-btn save-btn" id="btnSave" disabled><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span data-i18n="save">Save</span></button>
      <button class="tb-btn icon" id="btnLang" title="Language">ने</button>
      <button class="tb-btn icon" id="btnTheme" title="Theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <div class="win-ctrls" id="winCtrls" hidden>
        <button id="wMin" aria-label="Minimize"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
        <button id="wMax" aria-label="Maximize"><svg viewBox="0 0 10 10" width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
        <button id="wClose" class="close" aria-label="Close"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
      </div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="group">
      <button class="tool active" data-tool="select" data-i18n-title="tSelect" title="Select"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
      <button class="tool" data-tool="text" data-i18n-title="tText" title="Text"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tool" data-tool="highlight" data-i18n-title="tHighlight" title="Highlight"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-4 4h6l1-1"/><path d="M14 4l6 6-8 8-6-6z"/></svg></button>
      <button class="tool" data-tool="pen" data-i18n-title="tPen" title="Pen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
      <button class="tool" data-tool="rect" data-i18n-title="tRect" title="Rectangle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
      <button class="tool" data-tool="ellipse" data-i18n-title="tEllipse" title="Ellipse"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
      <button class="tool" data-tool="line" data-i18n-title="tLine" title="Line"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/></svg></button>
      <button class="tool" data-tool="note" data-i18n-title="tNote" title="Sticky note"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/></svg></button>
      <button class="tool" data-tool="check" data-i18n-title="tCheck" title="Check mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></button>
      <button class="tool" data-tool="cross" data-i18n-title="tCross" title="Cross"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="tool" data-tool="date" data-i18n-title="tDate" title="Date"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <button class="tool" data-tool="whiteout" data-i18n-title="tWhiteout" title="White-out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M5 15l4-4 3 3 3-3 4 4" opacity=".5"/></svg></button>
    </div>
    <div class="group">
      <button class="btn sign" id="btnSign"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-6 5-6 6-2s3 3 6-3"/><path d="M14 20h7"/></svg><span data-i18n="sign">Sign</span></button>
    </div>
    <div class="group">
      <input type="color" id="color" value="#d0021b" title="Color" />
      <select id="size" title="Size">
        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        <option value="5">5</option><option value="8">8</option>
      </select>
      <select id="fontSize" title="Font size">
        <option>10</option><option>12</option><option selected>14</option><option>18</option><option>24</option><option>32</option>
      </select>
    </div>
    <div class="group">
      <button class="tool" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="tool" id="btnRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="group">
      <button class="tool" id="zoomOut"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
      <span id="zoomLabel">100%</span>
      <button class="tool" id="zoomIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tool" id="zoomFit" data-i18n-title="fitWidth" title="Fit width"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
    </div>
    <div class="group">
      <input id="pageInput" type="number" min="1" value="1" /> <span id="pageCount">/ 0</span>
    </div>
    <div class="group search">
      <input id="searchInput" type="search" data-i18n-ph="search" placeholder="Search text" />
    </div>
  </div>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head"><span data-i18n="pages">Pages</span></div>
      <div id="thumbs"></div>
      <div id="searchResults" hidden></div>
    </aside>
    <section class="viewer" id="viewer">
      <div class="empty" id="empty">
        <div class="drop">
          <img src="/icon.svg" alt="" width="64" height="64" />
          <h1 data-i18n="welcome">Welcome to Documentaan</h1>
          <p data-i18n="dropHint">Drop a PDF here or click Open. Everything stays on your computer.</p>
          <div class="row">
            <button class="btn primary" id="btnOpen2" data-i18n="open">Open</button>
            <button class="btn" data-act="images" data-i18n="imagesToPdf">Images to PDF</button>
            <button class="btn" data-act="merge" data-i18n="merge">Merge PDFs</button>
          </div>
        </div>
      </div>
      <div id="pages"></div>
    </section>
  </main>

  <input type="file" id="fileInput" accept="application/pdf" hidden />
  <div id="modalRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
