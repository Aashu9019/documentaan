[package]
name = "documentaan"
version = "1.0.0"
description = "Documentaan - lightweight local PDF editor"
authors = ["Aashu9019"]
edition = "2021"

[lib]
name = "documentaan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
